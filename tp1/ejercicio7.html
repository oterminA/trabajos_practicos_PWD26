<!DOCTYPE html>
<!-- Ejercicio 7
Crear una página con un formulario que contenga dos input de tipo text y un select. En
los inputs se ingresarán números y el select debe dar la opción de una operación
matemática que podrá resolverse usando los números ingresados. En la página que
procesa la información se debe mostrar por pantalla la operación seleccionada, cada
uno de los operandos y el resultado obtenido de resolver la operación. Ejemplo del
formulario -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Ejercicio 7</title>
</head>

<body>
    <main class="contenedor-main">
        <div class="contenedor">
            <h1>Ejercicio n° 7</h1>
            <h2>Indicá los numeros de la operación</h2>
            <h3>Elegí una operación para hacer</h3>
            <form action="operaciones.php" method="POST" class="form-contenedor">
                <input type="number" name="numeroA" required step="0.01" placeholder="Ej: 5">
                <input type="number" name="numeroB" required step="0.01" placeholder="Ej: 10">
                <label>Operación</label>
                <select name="operacion" required>
                    <option value="">Seleccione una opcion</option>
                    <option value="suma">suma</option>
                    <option value="resta">resta</option>
                    <option value="division">division</option>
                    <option value="multiplicacion">multiplicacion</option>
                </select>

                <button type="reset" class="btn-borrar">Limpiar campos</button>
                <button type="submit" class="btn-enviar">Ver resultado</button>
            </form>
            <a href="/tp1/inicio_tp1.html" class="btn-volver">Volver al índice de ejercicios</a>
        </div>
    </main>
</body>

</html>
